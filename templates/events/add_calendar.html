{% extends 'base.html' %}
{% block title %}Додати календар{% endblock %}
{% block content %}
  <div class="hstack gap-3 mb-2">
    <h1>Додати календар</h1>
  </div>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Назва</label>
      <input type="text" name="name" class="form-control">
    </div>
    <button type="submit" class="btn btn-primary">Додати</button>
    <a href="{% url 'calendars-list' %}" class="btn btn-secondary">Скасувати</a>
  </form>
{% endblock %}
