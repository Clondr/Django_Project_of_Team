{% extends 'base.html' %}
{% block title %}Видалити календар{% endblock %}
{% block content %}
  <div class="card mt-3">
    <div class="card-body">
      <p class="card-text">Ви впевнені, що хочете видалити цей календар?</p>
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Видалити</button>
        <a href="{% url 'calendars-list' %}" class="btn btn-secondary">Скасувати</a>
      </form>
    </div>
  </div>
{% endblock %}
